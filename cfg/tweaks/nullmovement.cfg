//null-cancelling movement script

alias null ""

alias +nmov_forward "-back   ; +forward; trashcan_cycle; alias nmov_reforward +forward"
alias +nmov_back    "-forward; +back   ; trashcan_cycle; alias nmov_reback    +back"

alias -nmov_forward "-forward; nmov_reback   ; trashcan_cycle; alias nmov_reforward null"
alias -nmov_back    "-back   ; nmov_reforward; trashcan_cycle; alias nmov_reback    null"


alias +nmov_moveleft  "-moveright; +moveleft ; trashcan_cycle; alias nmov_removeleft  +moveleft"
alias +nmov_moveright "-moveleft ; +moveright; trashcan_cycle; alias nmov_removeright +moveright"

alias -nmov_moveleft  "-moveleft ; nmov_removeright; trashcan_cycle; alias nmov_removeleft  null"
alias -nmov_moveright "-moveright; nmov_removeleft ; trashcan_cycle; alias nmov_removeright null"


alias nmov_reforward null
alias nmov_reback    null

alias nmov_removeleft  null
alias nmov_removeright null


bind w +nmov_forward
bind s +nmov_back
bind a +nmov_moveleft
bind d +nmov_moveright
